description: This folder(task) runs the cid extractor, extracts tables and paragraphs, translates them and writes as a text file.

ignore_docs: [ '202510161809556307.pdf', 202401251248214607.pdf, 202402281636430907.pdf, 202402291118528507.pdf, 202403111710414107.pdf, 202403141300285907.pdf, 202403261501413807.pdf, 202404011125268707.pdf, 202407191225112807.pdf, 202412301902401607.pdf, 202501141534261307.pdf, 202501141703175807.pdf, 202501171158024707.pdf, 202503241820159007.pdf, 202503291458054807.pdf, 202506051550370407.pdf, 202507042004464907.pdf, 202507171651403607.pdf, 202507301125097207.pdf, 202509161924093807.pdf, 202512231516256207.pdf, 202512312031442907.pdf, 202512312039119307.pdf, 202601071221512807.pdf, 202604021641343907.pdf, 202604101739581907.pdf, 202606121304462307.pdf ]

output_dir: 'output'
config_dir: 'conf'
output_stub: 'doc'

pipeline:
  - name: pdf_cid_info

  - name: pdf_cid_reader
    config:
        swap_cids: [['sakalmarathi', 66, 126]] # u and dot (mumbai)

  - name: word_recognizer

  - name: pdftable_finder
    config:
      skip_row_with_merged_cells: False
      heading_offset: 0 # ignore heading
      header_row: never
      pdfplumber_config:
        vertical_strategy: lines
        horizontal_strategy: lines

  - name: line_finder
    config:
      keep_empty_lines: True
      quick: True
      newline_height_multiple: 1.6

  - name: para_finder
    config:
      write_output: False

  - name: extract_order_number      

  - name: doc_translator_hf
    config:
      src_lang: 'mar_Deva'
      tgt_lang: 'eng_Latn'

  - name: text_writer
    config:
      languages: ['en', 'mr']
